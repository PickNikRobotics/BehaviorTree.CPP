name: cmake Windows

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, a failing Debug job cancels Release mid-build and hides
      # whatever it would have reported.
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v6

    - name: Install Conan
      id: conan
      uses: turtlebrowser/get-conan@main

    - name: Create default profile
      run: conan profile detect

    - name: Install conan dependencies
      # encryption=tweetnacl swaps zeromq's default libsodium dependency for the
      # copy bundled in libzmq. CURVE support is unchanged; what goes away is the
      # only conan package in this graph built by msbuild instead of cmake.
      # libsodium's hand-written .vcxproj gets PlatformToolset v145 from
      # compiler.version=195 while vcvars lands on VCToolsVersion 14.44, and
      # msbuild rejects the pair (MSB8052).
      run: conan install conanfile.py -s build_type=${{ matrix.build_type }} -o "zeromq/*:encryption=tweetnacl" --build=missing --settings:host compiler.cppstd=17

    - name: Normalize build type
      shell: bash
      run: echo "BUILD_TYPE_LOWERCASE=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      run: cmake --preset conan-default

    - name: Build
      shell: bash
      run: cmake --build --preset conan-${{ env.BUILD_TYPE_LOWERCASE }}

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: $env:PATH+=";${{ matrix.build_type }}"; tests/${{ matrix.build_type }}/behaviortree_cpp_picknik_test.exe
